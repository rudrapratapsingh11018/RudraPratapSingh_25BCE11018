<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Polling App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Live Polling App</h1>

        <!-- Join Section -->
        <div class="join-section">
            <h2>Join a Poll</h2>
            <input type="text" id="roomInput" placeholder="Enter Room Code">
            <button onclick="joinPoll()">Join</button>
        </div>

        <hr>

        <!-- Admin Section -->
        <div class="admin-section">
            <h2>Admin Panel</h2>
            <p>Create and manage polls</p>
            <button onclick="goToAdmin()">Go to Admin</button>
        </div>
    </div>

<script>
function joinPoll() {
    const room = document.getElementById("roomInput").value.trim();

    if (room === "") {
        alert("Please enter a room code");
        return;
    }

    window.location.href = "vote.html?room=" + room;
}

function goToAdmin() {
    window.location.href = "admin.html";
}
</script>

</body>
</html>
